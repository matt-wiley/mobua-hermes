name: Feature request
description: Suggest an idea or a change to the design.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What you'd like to happen. Use the terms from CONTEXT.md where you can.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: input
    id: adrs
    attributes:
      label: Related ADRs
      description: Any ADRs in docs/adr/ this touches or would change.
      placeholder: e.g. 0005, 0015
