name: Bug report
description: Something doesn't work as expected.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Create a Channel with ...
        2. Run a Collection ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Version or commit, how you run it (container, local), database (SQLite, Postgres), and LLM Provider if relevant.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant log output or Channel Health details. Remove any Secrets or API keys first.
      render: text
